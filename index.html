<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Rebuttal - 授業用ディベート学習・AIプロンプト作成ツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        emerald: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 方眼紙・グリッド背景デザイン（緑のライン） */
        body {
            background-color: #f1f5f9;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-emerald-500 selection:text-white text-base sm:text-lg">

    <!-- Header Area -->
    <header class="bg-navy-950 text-white shadow-lg border-b-4 border-emerald-500 sticky top-0 z-50">
        <div class="max-w-[1800px] w-full mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-navy-950 shadow-md">
                    <i class="fa-solid fa-comments text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-wide text-white flex items-center gap-2">
                        Vital Rebuttal
                        <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-0.5 rounded-full font-bold">授業用</span>
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-300 font-medium">反論作成・音声入力・AI学習プロンプト生成ツール</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2 text-xs sm:text-sm text-slate-300 bg-navy-900 border border-slate-700 px-4 py-2 rounded-xl">
                <i class="fa-solid fa-graduation-cap text-emerald-400 text-base"></i>
                <span>高校英語ディベート導入授業対応</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area: 2:8 Split Grid for PC -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto px-4 sm:px-6 py-6">
        <div class="grid grid-cols-1 md:grid-cols-10 gap-6 h-full items-start">

            <!-- LEFT PANEL: 2 / 10 Width (20%) -->
            <aside class="md:col-span-3 lg:col-span-2 space-y-5">

                <!-- Card 1: 入力モード選択 -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                    <label class="text-base sm:text-lg font-extrabold text-navy-900 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-emerald-600"></i>
                        <span>入力モード</span>
                    </label>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="switchInputMode('split')" id="btn-mode-split" class="w-full py-3 px-3 rounded-xl border-2 font-bold text-base transition-all flex items-center justify-center gap-2 border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm">
                            <i class="fa-solid fa-cubes"></i>
                            <span>構成要素分割入力</span>
                        </button>
                        <button onclick="switchInputMode('single')" id="btn-mode-single" class="w-full py-3 px-3 rounded-xl border-2 border-slate-300 bg-white text-slate-700 hover:border-slate-400 font-bold text-base transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-lines"></i>
                            <span>全文一括入力</span>
                        </button>
                    </div>
                </div>

                <!-- Card 2: 反論対象（立論18選）選択 -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                    <label for="preset-select" class="text-base sm:text-lg font-extrabold text-navy-900 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-emerald-600"></i>
                        <span>反論対象の選択</span>
                    </label>
                    <select id="preset-select" onchange="loadPresetArgument()" class="w-full bg-white border-2 border-slate-300 rounded-xl px-3.5 py-3 text-base sm:text-lg text-slate-800 font-bold focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all shadow-inner">
                        <optgroup label="【論題1】E-learning is better than traditional learning">
                            <option value="e_ad1">【肯定 AD1】Time & Place Flexibility</option>
                            <option value="e_ad2">【肯定 AD2】Personalized Learning</option>
                            <option value="e_ad3">【肯定 AD3】Lower Cost & Eco-friendly</option>
                            <option value="e_da1">【否定 DA1】Social Interaction</option>
                            <option value="e_da2">【否定 DA2】Higher Motivation & Focus</option>
                            <option value="e_da3">【否定 DA3】Physical Health Issues</option>
                        </optgroup>

                        <optgroup label="【論題2】Western hotels are better than Japanese traditional inns">
                            <option value="h_ad1">【肯定 AD1】Flexibility of Schedule</option>
                            <option value="h_ad2">【肯定 AD2】Easy for Everyone to Use</option>
                            <option value="h_ad3">【肯定 AD3】Privacy and Independence</option>
                            <option value="h_da1">【否定 DA1】Special Cultural Experience</option>
                            <option value="h_da2">【否定 DA2】High-Quality Service & Food</option>
                            <option value="h_da3">【否定 DA3】Supporting Local Economy</option>
                        </optgroup>

                        <optgroup label="【論題3】Matsuyama is a great city to live in">
                            <option value="m_ad1">【肯定 AD1】Rich History and Culture</option>
                            <option value="m_ad2">【肯定 AD2】Compact & Convenient Living</option>
                            <option value="m_ad3">【肯定 AD3】Abundant Nature & Local Food</option>
                            <option value="m_da1">【否定 DA1】Lack of High-Paying Jobs</option>
                            <option value="m_da2">【否定 DA2】Water Shortage Risks</option>
                            <option value="m_da3">【否定 DA3】Limited External Transport</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Card 3: 大型スピーチタイマー (5分割ボタン) -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-3 text-center">
                    <div class="flex items-center justify-between text-navy-900 font-extrabold text-base sm:text-lg">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-stopwatch text-emerald-600"></i> タイマー
                        </span>
                        <span id="timer-status" class="text-xs sm:text-sm bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-md">停止中</span>
                    </div>

                    <!-- 大きな時間表示枠 -->
                    <div class="bg-navy-950 text-emerald-400 py-5 rounded-xl border-2 border-navy-800 shadow-inner">
                        <div id="timer-display" class="font-mono text-6xl sm:text-7xl font-black tracking-wider">01:00</div>
                    </div>

                    <!-- 下部 5分割ボタン (1分, 2分, 3分, 開始/一時停止, リセット) -->
                    <div class="grid grid-cols-5 gap-1.5 pt-1">
                        <button onclick="setTimer(60)" class="py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-xs sm:text-sm rounded-lg transition-all">1分</button>
                        <button onclick="setTimer(120)" class="py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-xs sm:text-sm rounded-lg transition-all">2分</button>
                        <button onclick="setTimer(180)" class="py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-xs sm:text-sm rounded-lg transition-all">3分</button>
                        <button onclick="toggleTimer()" id="btn-timer-start" class="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm rounded-lg transition-all shadow-sm">開始</button>
                        <button onclick="resetTimer()" class="py-3 bg-slate-300 hover:bg-slate-400 text-slate-800 font-bold text-xs sm:text-sm rounded-lg transition-all">リセット</button>
                    </div>
                </div>

                <!-- Card 4: プロンプト内容の確認・調整 (アコーディオン) -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-2">
                    <button onclick="togglePromptPreview()" class="w-full flex items-center justify-between text-navy-900 font-extrabold text-base sm:text-lg hover:text-emerald-600 transition-colors">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-code text-emerald-600"></i>
                            <span>プロンプト確認</span>
                        </span>
                        <i id="icon-prompt-arrow" class="fa-solid fa-chevron-down text-base transition-transform"></i>
                    </button>

                    <div id="container-prompt-preview" class="hidden pt-2 border-t border-slate-200 space-y-2">
                        <textarea id="prompt-preview-text" readonly class="w-full h-48 bg-slate-900 text-emerald-300 font-mono text-xs sm:text-sm p-3.5 rounded-lg border border-slate-700 outline-none resize-none custom-scrollbar leading-relaxed" placeholder="生成されるプロンプトがここにリアルタイム表示されます"></textarea>
                    </div>
                </div>

                <!-- Card 5: コピー後に開くAI連携ボタン -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-2.5">
                    <label class="text-xs sm:text-sm font-black text-slate-600 uppercase tracking-wider block">
                        コピー後に開くAIサービス
                    </label>
                    <div class="grid grid-cols-1 gap-2.5">
                        <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" class="py-3.5 px-4 bg-white hover:bg-blue-50 text-blue-700 border-2 border-blue-200 rounded-xl font-bold text-base sm:text-lg flex items-center justify-between transition-all shadow-sm group">
                            <span class="flex items-center gap-3">
                                <i class="fa-solid fa-wand-magic-sparkles text-blue-500 text-lg"></i> Gemini
                            </span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 group-hover:opacity-100"></i>
                        </a>
                        <a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer" class="py-3.5 px-4 bg-white hover:bg-emerald-50 text-emerald-800 border-2 border-emerald-200 rounded-xl font-bold text-base sm:text-lg flex items-center justify-between transition-all shadow-sm group">
                            <span class="flex items-center gap-3">
                                <i class="fa-solid fa-robot text-emerald-600 text-lg"></i> ChatGPT
                            </span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 group-hover:opacity-100"></i>
                        </a>
                        <a href="https://copilot.microsoft.com" target="_blank" rel="noopener noreferrer" class="py-3.5 px-4 bg-white hover:bg-purple-50 text-purple-700 border-2 border-purple-200 rounded-xl font-bold text-base sm:text-lg flex items-center justify-between transition-all shadow-sm group">
                            <span class="flex items-center gap-3">
                                <i class="fa-brands fa-microsoft text-purple-600 text-lg"></i> Copilot
                            </span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 group-hover:opacity-100"></i>
                        </a>
                    </div>
                </div>

                <!-- Card 6: 使い方説明 -->
                <div class="glass-card border-2 border-slate-200 rounded-2xl p-4 shadow-sm space-y-2 bg-gradient-to-b from-white to-emerald-50/50">
                    <label class="text-base sm:text-lg font-black text-navy-900 flex items-center gap-2">
                        <i class="fa-solid fa-circle-question text-emerald-600"></i>
                        <span>使い方説明</span>
                    </label>
                    <ol class="text-sm sm:text-base text-slate-700 font-medium space-y-2 pl-4 list-decimal leading-relaxed">
                        <li>反論対象を選ぶ。</li>
                        <li>反論を入力・音声入力する。</li>
                        <li>下のボタンでプロンプトをコピー。</li>
                        <li>AIを開いて貼り付けて確認！</li>
                    </ol>
                </div>

            </aside>

            <!-- RIGHT PANEL: 8 / 10 Width (80%) -->
            <section class="md:col-span-7 lg:col-span-8 space-y-6">

                <!-- TOP RIGHT: これから反論する文章（表示窓・常時表示されながら入力可能） -->
                <div class="glass-card border-2 border-slate-300 rounded-2xl p-6 sm:p-8 shadow-sm space-y-4 relative overflow-hidden bg-white">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                        <h2 class="text-2xl sm:text-3xl font-black text-navy-900 flex items-center gap-3">
                            <i class="fa-solid fa-bullhorn text-emerald-600"></i>
                            <span>これから反論する文章</span>
                        </h2>
                        <span class="text-sm sm:text-base bg-navy-900 text-white font-bold px-4 py-1.5 rounded-full shadow-sm">相手の立論</span>
                    </div>

                    <!-- ターゲット文章表示ボックス（白背景・濃い文字・少し小さめのフォントで一覧性重視） -->
                    <div id="target-speech-box" class="bg-white border-2 border-slate-300 rounded-xl p-5 sm:p-6 text-slate-900 font-bold text-xl sm:text-2xl leading-relaxed shadow-inner custom-scrollbar min-h-[120px] whitespace-pre-line">
                        <!-- JavaScriptにより選択したプリセット文が入ります -->
                    </div>
                </div>

                <!-- BOTTOM RIGHT: あなたの反論文章（入力エリア） -->
                <div class="glass-card border-2 border-slate-300 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6 bg-white">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                        <h2 class="text-2xl sm:text-3xl font-black text-navy-900 flex items-center gap-3">
                            <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                            <span>あなたの反論スピーチ作成</span>
                        </h2>
                        <div id="mode-badge" class="text-sm sm:text-base font-extrabold bg-emerald-100 text-emerald-900 border border-emerald-300 px-4 py-1.5 rounded-full">
                            分割入力モード
                        </div>
                    </div>

                    <!-- MODE 1: 構成要素分割入力 (Split Mode) -->
                    <div id="container-split-input" class="space-y-6">
                        
                        <!-- Step 1 -->
                        <div class="space-y-2.5">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <label class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-navy-900 text-white flex items-center justify-center text-base font-bold">1</span>
                                    <span>サインポスティング (相手の主張を引用)</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    <button onclick="clearField('input-step1')" class="px-3.5 py-2 bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-eraser"></i> 消去
                                    </button>
                                    <button onclick="toggleSpeechRec('input-step1', 'btn-mic-1')" id="btn-mic-1" class="px-3.5 py-2 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-900 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力
                                    </button>
                                </div>
                            </div>
                            <input type="text" id="input-step1" oninput="syncInputs('split')" class="w-full bg-white border-2 border-slate-300 rounded-xl px-5 py-4 text-xl sm:text-2xl text-slate-900 font-medium placeholder-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all shadow-inner" placeholder="例: They said that E-learning is flexible.">
                        </div>

                        <!-- Step 2 -->
                        <div class="space-y-2.5">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <label class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-navy-900 text-white flex items-center justify-center text-base font-bold">2</span>
                                    <span>大まかな主張 (反論の立場を示す)</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    <button onclick="clearField('input-step2')" class="px-3.5 py-2 bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-eraser"></i> 消去
                                    </button>
                                    <button onclick="toggleSpeechRec('input-step2', 'btn-mic-2')" id="btn-mic-2" class="px-3.5 py-2 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-900 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力
                                    </button>
                                </div>
                            </div>
                            <input type="text" id="input-step2" oninput="syncInputs('split')" class="w-full bg-white border-2 border-slate-300 rounded-xl px-5 py-4 text-xl sm:text-2xl text-slate-900 font-medium placeholder-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all shadow-inner" placeholder="例: However, I disagree with this point.">
                        </div>

                        <!-- Step 3 -->
                        <div class="space-y-2.5">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <label class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-navy-900 text-white flex items-center justify-center text-base font-bold">3</span>
                                    <span>理由・根拠・事例 (Why & Example)</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    <button onclick="clearField('input-step3')" class="px-3.5 py-2 bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-eraser"></i> 消去
                                    </button>
                                    <button onclick="toggleSpeechRec('input-step3', 'btn-mic-3')" id="btn-mic-3" class="px-3.5 py-2 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-900 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力
                                    </button>
                                </div>
                            </div>
                            <textarea id="input-step3" rows="3" oninput="syncInputs('split')" class="w-full bg-white border-2 border-slate-300 rounded-xl p-5 text-xl sm:text-2xl text-slate-900 font-medium placeholder-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all shadow-inner custom-scrollbar" placeholder="例: Because many students find it difficult to study without a fixed schedule. For example, they may play games instead of studying."></textarea>
                        </div>

                        <!-- Step 4 -->
                        <div class="space-y-2.5">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <label class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-lg bg-navy-900 text-white flex items-center justify-center text-base font-bold">4</span>
                                    <span>結論 (影響・まとめ)</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    <button onclick="clearField('input-step4')" class="px-3.5 py-2 bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-eraser"></i> 消去
                                    </button>
                                    <button onclick="toggleSpeechRec('input-step4', 'btn-mic-4')" id="btn-mic-4" class="px-3.5 py-2 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-900 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                        <i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力
                                    </button>
                                </div>
                            </div>
                            <input type="text" id="input-step4" oninput="syncInputs('split')" class="w-full bg-white border-2 border-slate-300 rounded-xl px-5 py-4 text-xl sm:text-2xl text-slate-900 font-medium placeholder-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all shadow-inner" placeholder="例: Therefore, traditional learning is better for maintaining study habits.">
                        </div>

                    </div>

                    <!-- MODE 2: 全文一括入力 (Single Mode) -->
                    <div id="container-single-input" class="hidden space-y-3">
                        <div class="flex items-center justify-between flex-wrap gap-2 pb-1">
                            <label class="text-lg sm:text-xl font-extrabold text-slate-900">
                                全文入力テキストエリア (サインポスティング〜結論まで一括)
                            </label>
                            <div class="flex items-center gap-2">
                                <button onclick="clearField('user-speech-single')" class="px-3.5 py-2 bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                    <i class="fa-solid fa-eraser"></i> 消去
                                </button>
                                <button onclick="toggleSpeechRec('user-speech-single', 'btn-mic-single')" id="btn-mic-single" class="px-3.5 py-2 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-900 rounded-xl border border-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                    <i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力
                                </button>
                            </div>
                        </div>
                        <textarea id="user-speech-single" rows="9" oninput="syncInputs('single')" class="w-full bg-white border-2 border-slate-300 rounded-xl p-6 text-xl sm:text-2xl text-slate-900 font-medium placeholder-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none leading-relaxed transition-all shadow-inner custom-scrollbar" placeholder="相手の文章に対するあなたの反論スピーチ（英語）を一括入力してください。"></textarea>
                    </div>

                    <!-- Action: Big Copy Button with Thickness -->
                    <div class="pt-6 border-t-2 border-slate-100">
                        <button onclick="copyGeneratedPrompt()" id="btn-copy-prompt" class="w-full py-6 sm:py-8 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-400 hover:to-teal-400 text-navy-950 font-black text-2xl sm:text-4xl rounded-2xl shadow-xl shadow-emerald-500/25 active:scale-[0.99] transition-all flex items-center justify-center gap-4 ring-4 ring-emerald-400/50">
                            <i class="fa-solid fa-copy text-3xl sm:text-5xl"></i>
                            <span>AI用プロンプトをコピーする（準備完了）</span>
                        </button>
                    </div>

                </div>

            </section>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-navy-950 text-white px-6 py-4 rounded-2xl shadow-2xl border-2 border-emerald-500 translate-y-24 opacity-0 transition-all duration-300 flex items-center gap-3 z-50 max-w-md">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
        <span id="toast-message" class="font-bold text-base sm:text-lg">プロンプトをクリップボードにコピーしました！</span>
    </div>

    <!-- Script Logic -->
    <script>
        // 18 Preset Arguments Data
        const argumentsMap = {
            "e_ad1": "【Motion: E-learning is better than traditional learning】\n【Affirmative AD1】Flexibility of Time and Place\nE-learning allows students to learn anytime and anywhere at their own pace. If they do not understand something, they can pause or rewatch the lesson without traveling to school.",
            "e_ad2": "【Motion: E-learning is better than traditional learning】\n【Affirmative AD2】Personalization of Learning\nE-learning offers various learning materials that fit each student's level. Students can choose lessons matching their skills and interests, which helps them stay motivated.",
            "e_ad3": "【Motion: E-learning is better than traditional learning】\n【Affirmative AD3】Lower Cost and Eco-friendly\nE-learning reduces costs for families and helps the environment. Digital textbooks and online classes save paper and travel expenses.",
            "e_da1": "【Motion: E-learning is better than traditional learning】\n【Negative DA1】Social Interaction\nTraditional learning helps students build real face-to-face human relationships. In classrooms, students learn how to cooperate, communicate, and solve problems with friends.",
            "e_da2": "【Motion: E-learning is better than traditional learning】\n【Negative DA2】Higher Motivation and Focus\nTraditional learning makes it easier for students to focus on their studies. At school, teachers and classmates create a structured environment without home temptations like games.",
            "e_da3": "【Motion: E-learning is better than traditional learning】\n【Negative DA3】Physical Health Issues\nE-learning causes physical health problems for students. Staring at screens for long hours causes eye strain, headaches, and a lack of exercise.",

            "h_ad1": "【Motion: Western hotels are better than Japanese traditional inns】\n【Affirmative AD1】Flexibility of Schedule\nWestern hotels give guests more freedom to manage their schedules. Guests can decide their meal times and check-in times without strict rules.",
            "h_ad2": "【Motion: Western hotels are better than Japanese traditional inns】\n【Affirmative AD2】Easy for Everyone to Use\nWestern hotels provide comfortable beds and chairs, reducing physical strain for elderly or international guests who are not used to sitting on tatami.",
            "h_ad3": "【Motion: Western hotels are better than Japanese traditional inns】\n【Affirmative AD3】Privacy and Independence\nWestern hotels respect guest privacy. Staff members do not enter rooms unnecessarily, allowing guests to relax quietly by themselves.",
            "h_da1": "【Motion: Western hotels are better than Japanese traditional inns】\n【Negative DA1】Special Cultural Experience\nJapanese traditional inns offer unique cultural experiences. Guests can enjoy Japanese traditions such as tatami rooms, yukata, and onsen baths.",
            "h_da2": "【Motion: Western hotels are better than Japanese traditional inns】\n【Negative DA2】High-Quality Service and Food\nJapanese traditional inns provide warm hospitality (Omotenashi) and high-quality seasonal meals served directly in guest rooms.",
            "h_da3": "【Motion: Western hotels are better than Japanese traditional inns】\n【Negative DA3】Supporting Local Economy\nJapanese traditional inns support the local economy directly by purchasing fresh ingredients, crafts, and goods from local suppliers and farmers.",

            "m_ad1": "【Motion: Matsuyama is a great city to live in】\n【Affirmative AD1】Rich History and Culture\nMatsuyama has a rich history and traditional culture. People can easily visit famous historic places like Matsuyama Castle and Dogo Onsen.",
            "m_ad2": "【Motion: Matsuyama is a great city to live in】\n【Affirmative AD2】Compact and Convenient Living\nMatsuyama is a compact and convenient city. Public transportation like trams connects main attractions, shopping areas, and hospitals within short distances.",
            "m_ad3": "【Motion: Matsuyama is a great city to live in】\n【Affirmative AD3】Abundant Nature and Local Food\nMatsuyama offers fresh local food thanks to its rich natural environment. Residents can enjoy fresh seafood from the Seto Inland Sea and delicious citrus fruits.",
            "m_da1": "【Motion: Matsuyama is a great city to live in】\n【Negative DA1】Lack of High-Paying Job Opportunities\nMatsuyama lacks sufficient job opportunities for young people compared to big cities like Tokyo or Osaka, so many graduates leave the city.",
            "m_da2": "【Motion: Matsuyama is a great city to live in】\n【Negative DA2】Water Shortage Risks\nMatsuyama often suffers from serious water shortages during hot, dry summers because the city does not have large rivers.",
            "m_da3": "【Motion: Matsuyama is a great city to live in】\n【Negative DA3】Limited Transportation Outside the City\nAccess from Matsuyama to other major Japanese cities is inconvenient and expensive because Shikoku does not have Shinkansen bullet train lines."
        };

        // Application State
        let currentMode = 'split'; // 'split' or 'single'
        let activeRecognition = null;
        let activeMicBtnId = null;
        let isSyncing = false;

        // Timer State
        let timerDuration = 60;
        let timerRemaining = 60;
        let timerInterval = null;
        let isTimerRunning = false;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadPresetArgument();
            updatePromptPreview();
        });

        // Load Preset Argument into Target Box
        function loadPresetArgument() {
            const key = document.getElementById('preset-select').value;
            const text = argumentsMap[key] || "立論が選択されていません。";
            document.getElementById('target-speech-box').innerText = text;
            updatePromptPreview();
        }

        // Switch Input Mode with Two-Way Synchronization
        function switchInputMode(mode) {
            if (currentMode === mode) return;
            
            if (currentMode === 'split' && mode === 'single') {
                const s1 = document.getElementById('input-step1').value.trim();
                const s2 = document.getElementById('input-step2').value.trim();
                const s3 = document.getElementById('input-step3').value.trim();
                const s4 = document.getElementById('input-step4').value.trim();
                const combined = [s1, s2, s3, s4].filter(Boolean).join(' ');
                document.getElementById('user-speech-single').value = combined;
            } else if (currentMode === 'single' && mode === 'split') {
                const singleText = document.getElementById('user-speech-single').value.trim();
                document.getElementById('input-step1').value = '';
                document.getElementById('input-step2').value = '';
                document.getElementById('input-step3').value = singleText;
                document.getElementById('input-step4').value = '';
            }

            currentMode = mode;
            const btnSplit = document.getElementById('btn-mode-split');
            const btnSingle = document.getElementById('btn-mode-single');
            const containerSplit = document.getElementById('container-split-input');
            const containerSingle = document.getElementById('container-single-input');
            const badge = document.getElementById('mode-badge');

            if (mode === 'split') {
                btnSplit.className = "w-full py-3 px-3 rounded-xl border-2 font-bold text-base transition-all flex items-center justify-center gap-2 border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm";
                btnSingle.className = "w-full py-3 px-3 rounded-xl border-2 border-slate-300 bg-white text-slate-700 hover:border-slate-400 font-bold text-base transition-all flex items-center justify-center gap-2";
                containerSplit.classList.remove('hidden');
                containerSingle.classList.add('hidden');
                badge.innerText = "分割入力モード";
            } else {
                btnSingle.className = "w-full py-3 px-3 rounded-xl border-2 font-bold text-base transition-all flex items-center justify-center gap-2 border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm";
                btnSplit.className = "w-full py-3 px-3 rounded-xl border-2 border-slate-300 bg-white text-slate-700 hover:border-slate-400 font-bold text-base transition-all flex items-center justify-center gap-2";
                containerSingle.classList.remove('hidden');
                containerSplit.classList.add('hidden');
                badge.innerText = "全文一括入力モード";
            }
            updatePromptPreview();
        }

        // Live Synchronization between Split Inputs and Single Input
        function syncInputs(source) {
            if (isSyncing) return;
            isSyncing = true;

            if (source === 'split') {
                const s1 = document.getElementById('input-step1').value.trim();
                const s2 = document.getElementById('input-step2').value.trim();
                const s3 = document.getElementById('input-step3').value.trim();
                const s4 = document.getElementById('input-step4').value.trim();
                const combined = [s1, s2, s3, s4].filter(Boolean).join(' ');
                document.getElementById('user-speech-single').value = combined;
            } else if (source === 'single') {
                const singleText = document.getElementById('user-speech-single').value;
                document.getElementById('input-step3').value = singleText;
            }

            isSyncing = false;
            updatePromptPreview();
        }

        // Clear individual field
        function clearField(fieldId) {
            document.getElementById(fieldId).value = '';
            if (fieldId.startsWith('input-')) {
                syncInputs('split');
            } else {
                syncInputs('single');
            }
            updatePromptPreview();
        }

        // Voice Recognition Handling (Speech-to-Text) - Display "録音中..."
        function toggleSpeechRec(inputId, btnId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showToast("お使いのブラウザは音声入力に対応していません。Google Chrome等をお使いください。", "warning");
                return;
            }

            if (activeRecognition && activeMicBtnId === btnId) {
                activeRecognition.stop();
                return;
            }

            if (activeRecognition) {
                activeRecognition.stop();
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);

            recognition.onstart = () => {
                activeRecognition = recognition;
                activeMicBtnId = btnId;
                btn.classList.add('bg-red-500', 'text-white', 'animate-pulse', 'border-red-600');
                btn.classList.remove('bg-slate-100', 'text-slate-700');
                btn.innerHTML = `<i class="fa-solid fa-square"></i> 録音中...`;
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (input.value.trim() !== '') {
                    input.value += ' ' + transcript;
                } else {
                    input.value = transcript;
                }
                
                if (currentMode === 'split') {
                    syncInputs('split');
                } else {
                    syncInputs('single');
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                showToast("音声認識エラー: " + event.error, "error");
                resetMicBtn(btnId);
            };

            recognition.onend = () => {
                resetMicBtn(btnId);
                activeRecognition = null;
                activeMicBtnId = null;
            };

            recognition.start();
        }

        function resetMicBtn(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.remove('bg-red-500', 'text-white', 'animate-pulse', 'border-red-600');
                btn.classList.add('bg-slate-100', 'text-slate-700');
                btn.innerHTML = `<i class="fa-solid fa-microphone text-emerald-600"></i> 音声入力`;
            }
        }

        // Get Assembled User Rebuttal Text
        function getUserSpeechText() {
            if (currentMode === 'split') {
                const step1 = document.getElementById('input-step1').value.trim();
                const step2 = document.getElementById('input-step2').value.trim();
                const step3 = document.getElementById('input-step3').value.trim();
                const step4 = document.getElementById('input-step4').value.trim();

                const parts = [];
                if (step1) parts.push(step1);
                if (step2) parts.push(step2);
                if (step3) parts.push(step3);
                if (step4) parts.push(step4);

                return parts.join(' ');
            } else {
                return document.getElementById('user-speech-single').value.trim();
            }
        }

        // Construct Full AI Prompt Text including evaluation criteria [1]~[8]
        function generatePromptText() {
            const targetText = document.getElementById('target-speech-box').innerText;
            const userSpeech = getUserSpeechText();

            return `あなたは高校生の英語ディベート学習を支援する丁寧で親切な指導コーチです。
生徒が相手の立論に対して作成した反論スピーチ（Rebuttal）について、以下の指示・条件に従ってフィードバックを行ってください。

【指導・アドバイスの条件】
1. 反論の4ステップ構成（①相手の意見の引用/サインポスティング → ②自分の主張・反論 → ③理由・根拠・事例 → ④結論・影響）を重視してください。
2. 基本的な英検準2級程度の表現をベースにしつつ、学習者がそれ以上の高度な語彙や適切な表現に挑戦できている場合は積極的に褒めて評価してください。
3. 全体のフィードバック文量は、通常のゴシック体フォント（10.5pt設定）で【A4用紙片面1枚】に無理なく綺麗に収まるよう、要点を絞って簡潔かつ明瞭に出力してください。

【出力フォーマット（必ず以下の形式・見出しで出力してください）】
[1] 選択した立論:
${targetText}

[2] 学習者の回答:
${userSpeech || '(生徒の入力がありません)'}

[3] 評価 ①論理性:
（10人のジャッジがいるとしたら、何人がこの反論に対して「説得力あり」と答えるか推測し、10点満点で評価とその理由を述べてください）

[4] 評価 ②英文の精度:
（文法ミスの少なさ、語彙選びの精度など、英語ライティングの観点から10点満点で評価とその理由を述べてください）

[5] 良かった点:
（スピーチ内容の素晴らしい点や挑戦した表現を具体的に褒めてください）

[6] 構成・構造に関するアドバイス:
（4ステップ構造や反論の論理性に関する具体的な改善アドバイスを述べてください）

[7] より自然な英語表現:
（文法ミスや、より自然・効果的な語彙・フレーズへの改善提案を箇条書きで示してください）

[8] 模範反論:
（学習者の意図を活かし、4ステップに沿った完成度の高い模範反論英文を提示してください）`;
        }

        // Update Prompt Preview Area
        function updatePromptPreview() {
            const previewEl = document.getElementById('prompt-preview-text');
            if (previewEl) {
                previewEl.value = generatePromptText();
            }
        }

        // Toggle Prompt Preview Accordion
        function togglePromptPreview() {
            const previewContainer = document.getElementById('container-prompt-preview');
            const icon = document.getElementById('icon-prompt-arrow');

            if (previewContainer.classList.contains('hidden')) {
                previewContainer.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                previewContainer.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Copy Prompt to Clipboard with robust multi-fallback
        async function copyGeneratedPrompt() {
            const promptText = generatePromptText();
            let copied = false;

            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(promptText);
                    copied = true;
                } catch (err) {
                    console.warn("Clipboard API failed, trying fallback:", err);
                }
            }

            if (!copied) {
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = promptText;
                tempTextarea.style.position = 'fixed';
                tempTextarea.style.left = '-9999px';
                tempTextarea.style.top = '0';
                document.body.appendChild(tempTextarea);
                tempTextarea.focus();
                tempTextarea.select();

                try {
                    copied = document.execCommand('copy');
                } catch (err) {
                    console.error("execCommand failed:", err);
                } finally {
                    document.body.removeChild(tempTextarea);
                }
            }

            if (copied) {
                showToast("AI用プロンプトをコピーしました！下のAIボタンを開いて貼り付けてください。", "success");
            } else {
                const previewContainer = document.getElementById('container-prompt-preview');
                const previewEl = document.getElementById('prompt-preview-text');
                const icon = document.getElementById('icon-prompt-arrow');

                if (previewContainer.classList.contains('hidden')) {
                    previewContainer.classList.remove('hidden');
                    icon.classList.add('rotate-180');
                }

                previewEl.focus();
                previewEl.select();
                showToast("テキストを選択しました。「Ctrl + C」(MacはCmd+C) でコピーしてください。", "warning");
            }
        }

        // Toast Notification
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;

            if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-xl";
                toast.className = "fixed bottom-6 right-6 bg-navy-950 text-white px-6 py-4 rounded-2xl shadow-2xl border-2 border-amber-500 translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-3 z-50 max-w-md";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400 text-xl";
                toast.className = "fixed bottom-6 right-6 bg-navy-950 text-white px-6 py-4 rounded-2xl shadow-2xl border-2 border-red-500 translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-3 z-50 max-w-md";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-xl";
                toast.className = "fixed bottom-6 right-6 bg-navy-950 text-white px-6 py-4 rounded-2xl shadow-2xl border-2 border-emerald-500 translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-3 z-50 max-w-md";
            }

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 4000);
        }

        // Speech Timer Functions
        function setTimer(seconds) {
            pauseTimer();
            timerDuration = seconds;
            timerRemaining = seconds;
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timerRemaining <= 0) timerRemaining = timerDuration;
            isTimerRunning = true;
            document.getElementById('btn-timer-start').innerText = "一時停止";
            document.getElementById('btn-timer-start').className = "py-3 bg-amber-500 hover:bg-amber-400 text-white font-black text-xs sm:text-sm rounded-lg transition-all shadow-sm";
            document.getElementById('timer-status').innerText = "計測中";
            document.getElementById('timer-status').className = "text-xs sm:text-sm bg-emerald-500 text-white px-2.5 py-0.5 rounded-md font-bold";

            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerDisplay();

                if (timerRemaining <= 0) {
                    pauseTimer();
                    playBeepSound();
                    showToast("時間が終了しました！", "warning");
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('btn-timer-start').innerText = "開始";
            document.getElementById('btn-timer-start').className = "py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm rounded-lg transition-all shadow-sm";
            document.getElementById('timer-status').innerText = "停止中";
            document.getElementById('timer-status').className = "text-xs sm:text-sm bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-md";
        }

        function resetTimer() {
            pauseTimer();
            timerRemaining = timerDuration;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerRemaining / 60);
            const secs = timerRemaining % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = formatted;
        }

        // Web Audio API Beep Sound for Timer Expiry
        function playBeepSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch (e) {
                console.log("Audio play prevented:", e);
            }
        }
    </script>
